<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js with GLB Model</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
    >
      <!-- Preload the model -->
      <a-assets>
        <a-asset-item id="mymodel" src="1.glb"></a-asset-item>
      </a-assets>

      <!-- Marker definition -->
      <a-marker preset="hiro">
        <a-gltf-model
          src="#mymodel"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="0 0 0"
        ></a-gltf-model>
      </a-marker>

      <!-- Required camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
