<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>GPS AR Video Player</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar-nft.js"></script>
    <style>
      body { margin: 0; overflow: hidden; }
      #controls {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.5);
        padding: 10px;
        border-radius: 8px;
        display: flex;
        gap: 8px;
      }
      #controls button {
        color: white;
        background: #333;
        border: none;
        padding: 8px 12px;
        border-radius: 4px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- AR Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      vr-mode-ui="enabled: false"
    >
      <a-camera gps-camera rotation-reader></a-camera>

      <a-assets>
        <video
          id="myVideo"
          src="video1.mp4"
          preload="auto"
          loop
          crossorigin="anonymous"
          playsinline
        ></video>
      </a-assets>

      <a-video
        id="videoPlane"
        gps-entity-place="latitude: 41.443139; longitude: 2.168695;"
        src="#myVideo"
        width="2"
        height="1"
        rotation="0 180 0"
        scale="1 1 1"
      ></a-video>
    </a-scene>

    <!-- Controls -->
    <div id="controls">
      <button id="playBtn">Play</button>
      <button id="pauseBtn">Pause</button>
      <button id="restartBtn">Restart</button>
      <button id="scaleUpBtn">Scale +</button>
      <button id="scaleDownBtn">Scale −</button>
    </div>

    <script>
      const video = document.getElementById('myVideo');
      const videoPlane = document.getElementById('videoPlane');

      let scaleFactor = 1;

      document.getElementById('playBtn').addEventListener('click', () => {
        video.play();
      });

      document.getElementById('pauseBtn').addEventListener('click', () => {
        video.pause();
      });

      document.getElementById('restartBtn').addEventListener('click', () => {
        video.currentTime = 0;
        video.play();
      });

      document.getElementById('scaleUpBtn').addEventListener('click', () => {
        scaleFactor += 0.2;
        videoPlane.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
      });

      document.getElementById('scaleDownBtn').addEventListener('click', () => {
        scaleFactor = Math.max(0.2, scaleFactor - 0.2);
        videoPlane.setAttribute('scale', `${scaleFactor} ${scaleFactor} ${scaleFactor}`);
      });
    </script>
  </body>
</html>
